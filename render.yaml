services:
  - type: web
    name: tedbirge-ai
    env: node
    region: frankfurt
    plan: free
    buildCommand: npm ci --omit=dev && npx prisma generate && npx prisma migrate deploy
    startCommand: node src/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANALYSIS_MODE
        value: real
      - key: OCR_PROVIDER
        value: mock
      - key: PORT
        value: "5000"
